<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Smart Office</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>

  <!-- Tela de proteção: só imagem de fundo, toque em qualquer lugar entra no painel -->
  <section id="screensaver" class="screen screensaver">
    <img class="screensaver__logo" src="assets/logo.png" alt="NosZona - Smart City Cabo Verde">
    <div class="screensaver__clock">
      <div id="ss-clock" class="screensaver__time">--:--</div>
      <div id="ss-date" class="screensaver__date">-- de -- de ----</div>
    </div>

    <!-- Notificações de timer, estilo lock screen — pilha de cartões; toque expande a lista completa -->
    <div id="ss-notifications" class="ss-notifications hidden">
      <div class="ss-notif-stack" id="ss-notif-stack">
        <div class="ss-notif-ghost ss-notif-ghost--2" id="ss-notif-ghost-2"></div>
        <div class="ss-notif-ghost ss-notif-ghost--1" id="ss-notif-ghost-1"></div>
        <div class="ss-notif">
          <span class="ss-notif__icon" id="ss-notif-icon"></span>
          <div class="ss-notif__body">
            <div class="ss-notif__label">Timer agendado</div>
            <div class="ss-notif__detail" id="ss-notif-detail"></div>
          </div>
          <span class="ss-notif__count hidden" id="ss-notif-count"></span>
        </div>
      </div>
      <div class="ss-notif-list hidden" id="ss-notif-list"></div>
    </div>
  </section>

  <!-- Painel de controle: só os cards -->
  <section id="panel" class="screen panel hidden">
    <main id="tile-grid" class="tile-grid">
      <!-- Tiles renderizados via JS -->
    </main>
  </section>

  <!-- Modal genérico de detalhes (Relógio, Luz, A.C., Clima, Tomada) — fullscreen, sem header -->
  <div id="detail-modal" class="modal hidden">
    <button id="detail-back" class="icon-btn modal-back" aria-label="Voltar">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div id="detail-body" class="modal-body"></div>

    <!-- Popup para renomear tomada/lâmpada -->
    <div id="rename-popup" class="popup hidden">
      <div class="popup__card">
        <div class="popup__title">Editar nome</div>
        <input id="rename-input" class="rename-input" type="text" maxlength="40" placeholder="Nome do dispositivo">
        <div class="rename-actions">
          <button id="rename-cancel" class="rename-btn rename-btn--ghost">Cancelar</button>
          <button id="rename-save" class="rename-btn rename-btn--primary">Guardar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal do Timer — fullscreen, sem header, com botões de scroll -->
  <div id="timer-modal" class="modal hidden">
    <button id="timer-back" class="icon-btn modal-back" aria-label="Voltar">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>

    <div class="timer-layout">
      <div id="timer-body" class="modal-body timer-layout__content">
        <div id="timer-list" class="timer-list"></div>

        <div class="timer-form">
          <div class="timer-form__label">Dispositivo</div>
          <div id="timer-device-buttons" class="chip-grid"></div>

          <div class="timer-form__label">Ação</div>
          <div id="timer-action-buttons" class="chip-grid chip-grid--2">
            <div class="mode-chip is-active" data-action="on">Ligar</div>
            <div class="mode-chip" data-action="off">Desligar</div>
          </div>

          <div class="timer-form__label">Horário</div>
          <select id="timer-time" class="timer-form__field">
            <!-- Opções de horário populadas via JS -->
          </select>

          <button id="timer-add" class="timer-form__add">Adicionar</button>
        </div>
      </div>

      <!-- Coluna isolada: as setas de rolar nunca sobrepõem os botões do conteúdo -->
      <div class="timer-layout__scroll">
        <button id="timer-scroll-up" class="icon-btn scroll-btn" aria-label="Rolar para cima">
          <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg>
        </button>
        <button id="timer-scroll-down" class="icon-btn scroll-btn" aria-label="Rolar para baixo">
          <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
        </button>
      </div>
    </div>

    <!-- Popup de confirmação ao criar um timer -->
    <div id="timer-confirm" class="popup hidden">
      <div class="popup__card">
        <div class="popup__icon">
          <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
        </div>
        <div class="popup__title">Timer criado</div>
        <div class="popup__detail">
          <span id="timer-confirm-device"></span> —
          <span id="timer-confirm-action"></span> às
          <span id="timer-confirm-time"></span>
        </div>
        <button id="timer-confirm-ok" class="popup__ok">OK</button>
      </div>
    </div>
  </div>

  <!-- Área administrativa (controlo de acessos RFID) — vistas renderizadas via JS -->
  <section id="admin" class="screen admin hidden" aria-label="Administração">
    <div id="admin-login" class="adm-login">
      <form id="admin-login-form" class="adm-login__card" autocomplete="off" novalidate>
        <div class="adm-brand"><span class="adm-brand__icon" data-icon="shield"></span><span>Smart Office</span><span class="adm-badge">Admin</span></div>
        <h1 class="adm-login__title">Acesso administrativo</h1>
        <label class="adm-field">
          <span>Utilizador</span>
          <input id="admin-username" class="adm-input" name="username" type="text" autocomplete="username" autocapitalize="off" spellcheck="false" maxlength="64">
        </label>
        <label class="adm-field">
          <span>Palavra-passe</span>
          <input id="admin-password" class="adm-input" name="password" type="password" autocomplete="current-password" maxlength="256">
        </label>
        <div id="admin-login-msg" class="adm-login__msg hidden" role="alert"></div>
        <div class="adm-login__actions">
          <button type="button" id="admin-login-back" class="adm-btn adm-btn--ghost">Voltar</button>
          <button type="submit" id="admin-login-submit" class="adm-btn adm-btn--primary">Entrar</button>
        </div>
      </form>
    </div>

    <div id="admin-shell" class="adm-shell hidden">
      <aside class="adm-nav">
        <div class="adm-brand adm-nav__brand"><span class="adm-brand__icon" data-icon="shield"></span><span>Smart Office</span><span class="adm-badge">Admin</span></div>
        <nav id="admin-nav" class="adm-nav__list" aria-label="Menu administrativo"></nav>
        <button type="button" id="admin-home" class="adm-nav__item adm-nav__home" title="Voltar ao Smart Office"><span data-icon="home"></span><span>Smart Office</span></button>
      </aside>
      <div class="adm-main">
        <header class="adm-topbar">
          <h1 id="admin-title" class="adm-topbar__title"></h1>
          <span id="admin-user" class="adm-topbar__user"></span>
          <button type="button" id="admin-logout" class="adm-icon-btn" aria-label="Terminar sessão" title="Terminar sessão"><span data-icon="logout"></span></button>
        </header>
        <div id="admin-view" class="adm-view"></div>
      </div>
    </div>

    <div id="admin-dialog" class="popup adm-dialog hidden">
      <div id="admin-dialog-card" class="popup__card adm-dialog__card" role="dialog" aria-modal="true"></div>
    </div>
    <div id="admin-toast" class="adm-toast" aria-live="polite"></div>
  </section>

  <script src="js/dataProvider.js"></script>
  <script src="js/adminApi.js"></script>
  <script src="js/adminAuth.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
